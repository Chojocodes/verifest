<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>VeriFest — Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 10a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1a2 2 0 0 0 0 4v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1a2 2 0 0 0 0-4v-1z" stroke="#ffb020" stroke-width="1.6"/><path d="M9 8v8" stroke="#1fc8a3" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
      <h1>Veri<span>Fest</span></h1>
    </div>
    <p class="sub">Base price ₹{{ base_price }}. Your CGPA-based discount is applied automatically — no coupon codes, no manual approval.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="post">
      <label>Full name</label>
      <input name="name" required>
      <label>College email</label>
      <input name="email" type="email" required>
      <label>Roll number</label>
      <input name="roll_no" required>
      <label>CGPA (0–10)</label>
      <input name="cgpa" type="number" step="0.01" min="0" max="10" required>
      <button type="submit">Continue to payment</button>
    </form>
    <p class="sub" style="text-align:center;margit-top:14px"><a href="{{ url_for('admin') }}">Organizer dashboard →</a></p>
  </div>
</body>
</html>
